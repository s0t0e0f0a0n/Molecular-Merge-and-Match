# Run the full stack locally with: docker compose up --build
# Frontend: http://localhost

services:
  backend:
    build:
      context: ./backend
    environment:
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-127.0.0.1,localhost,backend}
      ENABLE_DOCS: ${ENABLE_DOCS:-0}
    volumes:
      # Persist the SQLite database across container restarts
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
