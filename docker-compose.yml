# Run the full stack locally with: docker compose up --build
# Frontend: http://localhost
# Backend:  http://localhost:8000

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      # Persist the SQLite database across container restarts
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
