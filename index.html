<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Available Downloads</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
        h1 { border-bottom: 1px solid #eaecef; padding-bottom: 0.3em; }
        ul { list-style-type: none; padding: 0; }
        li { padding: 8px 12px; border-bottom: 1px solid #f6f8fa; display: flex; justify-content: space-between; }
        a { color: #0366d6; text-decoration: none; font-weight: 500; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>Download Directory</h1>
    <ul id="file-list">Loading files...</ul>

    <script>
        // Directly targets your username, repo, and specific exercise-files branch
        const username = "s0t0e0f0a0n";
        const repo = "Molecular-Merge-and-Match";
        const branch = "exercise-files";
        
        const apiUrl = `https://github.com{username}/${repo}/contents/?ref=${branch}`;

        fetch(apiUrl)
            .then(res => {
                if (!res.ok) {
                    throw new Error(`HTTP error! Status: ${res.status}`);
                }
                return res.json();
            })
            .then(data => {
                const list = document.getElementById('file-list');
                list.innerHTML = '';
                
                // Filter out index.html and hidden configuration files
                const files = data.filter(item => item.type === 'file' && item.name !== 'index.html' && !item.name.startsWith('.'));
                
                if (files.length === 0) {
                    list.innerHTML = '<li>No files found in this directory.</li>';
                    return;
                }

                files.forEach(file => {
                    const li = document.createElement('li');
                    // Uses download_url to download directly from the correct branch
                    li.innerHTML = `<a href="${file.download_url}">${file.name}</a> <span>(${(file.size / 1024 / 1024).toFixed(2)} MB)</span>`;
                    list.appendChild(li);
                });
            })
            .catch(err => {
                console.error('GitHub Pages Load Error:', err);
                document.getElementById('file-list').innerHTML = '<li>Error loading files. Check console or repository privacy settings.</li>';
            });
    </script>
</body>
</html>
